name: Build

on:
  push:
  pull_request:

jobs:
  build:
    name: Build
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build
        id: build
        uses: ./.github/actions/build

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: DrawAndGuessMod-${{ github.sha }}
          path: ${{ steps.build.outputs.zip_path }}
          retention-days: 10
